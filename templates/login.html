<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>餐厅数字化改革 - 登录</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .login-error {
            color: var(--brand-danger);
            font-size: 12px;
            margin-top: var(--space-sm);
            display: none;
        }
        .login-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            margin-top: 20px;
            padding-top: 16px;
        }
        .login-brand svg {
            margin-bottom: 0;
        }
        .login-brand span {
            font-size: 11px;
            color: var(--brand-gray);
            opacity: 0.5;
            letter-spacing: 2px;
        }
        /* 修改密码弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex !important; opacity: 1 !important; visibility: visible !important; }
        .modal {
            background: var(--brand-card-bg);
            border: 1px solid var(--brand-border);
            border-radius: var(--brand-radius-lg);
            padding: 28px;
            width: 380px;
            max-width: 90vw;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .modal h2 {
            font-family: var(--font-heading);
            font-size: 16px;
            margin-bottom: 4px;
            color: var(--brand-primary);
        }
        .modal .hint {
            font-size: 12px;
            color: var(--brand-secondary);
            margin-bottom: 20px;
        }
        .modal .form-group {
            margin-bottom: 16px;
        }
        .modal .form-group label {
            display: block;
            font-size: 12px;
            color: var(--brand-gray);
            margin-bottom: 4px;
        }
        .modal .form-group input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--brand-border);
            border-radius: var(--brand-radius);
            font-size: 14px;
            font-family: var(--font-en);
            background: var(--brand-bg);
            outline: none;
        }
        .modal .form-group input:focus {
            border-color: var(--brand-primary);
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .modal-actions button {
            flex: 1;
            padding: 10px;
            border-radius: var(--brand-radius);
            font-size: 14px;
            cursor: pointer;
            border: none;
            font-weight: 500;
            font-family: var(--font-cn);
        }
        .btn-primary {
            background: var(--brand-primary);
            color: white;
        }
        .btn-primary:hover { background: #243d33; }
        .pwd-error-msg {
            color: var(--brand-secondary);
            font-size: 12px;
            display: none;
            padding: 8px 0;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-logo">
                <h1>餐厅数字化改革</h1>
            </div>
            
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="username" name="username" placeholder="请输入用户名" required>
                </div>
                
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="password" name="password" placeholder="请输入密码" required>
                </div>
                
                <div class="login-error" id="loginError"></div>
                
                <button type="submit" class="login-btn">登录</button>
            </form>
            
            <div class="login-brand">
                <svg viewBox="0 0 64 64" width="48" height="48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 0,0 L 64,0 L 64,64 M 45,64 L 0,64 L 0,0"
                          stroke="#2D4A3E" stroke-width="2"
                          stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
                    <path d="M 64,0 L 45,13 L 45,64"
                          stroke="#2D4A3E" stroke-width="2"
                          stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
                </svg>
                <span>把复杂交给工具，把人还给价值</span>
            </div>
        </div>
    </div>
    
    <!-- 修改密码弹窗 -->
    <div class="modal-overlay" id="change-pwd-modal">
        <div class="modal">
            <h2>修改密码</h2>
            <p class="hint">首次登录必须修改默认密码</p>
            <div class="form-group">
                <label>原密码</label>
                <input type="password" id="old-password">
            </div>
            <div class="form-group">
                <label>新密码（至少6位）</label>
                <input type="password" id="new-password">
            </div>
            <div class="form-group">
                <label>确认新密码</label>
                <input type="password" id="confirm-password">
            </div>
            <div class="pwd-error-msg" id="pwdError"></div>
            <div class="modal-actions">
                <button class="btn-primary" onclick="handleChangePassword()">确认修改</button>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorEl = document.getElementById('loginError');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.style.display = 'none';
            
            const btn = form.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = '登录中...';
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            try {
                const resp = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                
                const data = await resp.json();
                console.log('[LOGIN] response:', JSON.stringify(data));
                
                if (data.success) {
                    if (data.must_change_password) {
                        console.log('[LOGIN] must_change_password=true, showing modal');
                        document.getElementById('change-pwd-modal').classList.add('active');
                        document.getElementById('old-password').value = password;
                        document.getElementById('new-password').focus();
                    } else {
                        window.location.href = '{{ next_url }}' || '/work-mgmt/calendar';
                    }
                } else {
                    errorEl.textContent = data.message || '登录失败';
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                errorEl.textContent = '网络错误，请重试';
                errorEl.style.display = 'block';
            } finally {
                btn.disabled = false; btn.textContent = '登录';
            }
        });

        async function handleChangePassword() {
            const oldPwd = document.getElementById('old-password').value;
            const newPwd = document.getElementById('new-password').value;
            const confirmPwd = document.getElementById('confirm-password').value;
            const errorEl = document.getElementById('pwdError');
            errorEl.style.display = 'none';

            if (!oldPwd || !newPwd || !confirmPwd) {
                errorEl.textContent = '请填写完整';
                errorEl.style.display = 'block';
                return;
            }
            if (newPwd !== confirmPwd) {
                errorEl.textContent = '两次输入的新密码不一致';
                errorEl.style.display = 'block';
                return;
            }
            if (newPwd.length < 6) {
                errorEl.textContent = '新密码至少6位';
                errorEl.style.display = 'block';
                return;
            }

            try {
                const res = await fetch('/api/change-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({old_password: oldPwd, new_password: newPwd})
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = '{{ next_url }}' || '/work-mgmt/calendar';
                } else {
                    errorEl.textContent = data.message || '修改失败';
                    errorEl.style.display = 'block';
                }
            } catch (e) {
                errorEl.textContent = '网络错误，请重试';
                errorEl.style.display = 'block';
            }
        }
    </script>
</body>
</html>
