{% extends "base.html" %}
{% block title %}系统管理 - 罗森批发管理{% endblock %}
{% block page_title %}账号管理{% endblock %}

{% block extra_css %}
<style>
.table-container {
    max-height: calc(100vh - 230px);
    overflow: auto;
    border: 1px solid rgba(0,0,0,.05);
}
.table-container thead th {
    position: sticky;
    top: 0;
    z-index: 1;
    background: var(--brand-primary) !important;
    color: #fff !important;
    box-shadow: 0 1px 0 rgba(0,0,0,0.08);
}
</style>
{% endblock %}

{% block content %}
<div class="page-toolbar">
    <div class="toolbar-left">
        <h3 style="font-size:14px;">账号列表</h3>
    </div>
    <div class="toolbar-right">
        <button class="btn btn-primary" onclick="showCreateModal()"><i class="fa-solid fa-plus"></i> 新增账号</button>
    </div>
</div>

<div class="table-container">
    <table class="data-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>用户名</th>
                <th>显示名</th>
                <th>角色</th>
                <th>需改密码</th>
                <th>创建时间</th>
                <th style="width:180px">操作</th>
            </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
    </table>
</div>

<!-- 新增弹窗 -->
<div class="modal-overlay" id="createModal">
    <div class="modal">
        <div class="modal-header">
            <h3 class="modal-title">新增账号</h3>
            <button class="modal-close" onclick="closeModal('createModal')"><i class="fa-solid fa-times"></i></button>
        </div>
        <div class="modal-body">
            <div class="form-group"><label>用户名 <span class="required">*</span></label><input type="text" id="createUsername"></div>
            <div class="form-group"><label>密码 <span class="required">*</span></label><input type="password" id="createPassword" placeholder="至少6位"></div>
            <div class="form-group"><label>显示名</label><input type="text" id="createDisplayName"></div>
            <div class="form-group"><label>角色</label>
                <select id="createRole">
                    <option value="admin">管理员</option>
                    <option value="carrier">承运商</option>
                    <option value="dc">DC大仓</option>
                </select>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal('createModal')">取消</button>
            <button class="btn btn-primary" onclick="createUser()">创建</button>
        </div>
    </div>
</div>

<!-- 修改密码弹窗 -->
<div class="modal-overlay" id="changePasswordModal">
    <div class="modal" style="max-width:400px;">
        <div class="modal-header">
            <h3 class="modal-title" id="cpModalTitle">修改密码</h3>
            <button class="modal-close" onclick="closeModal('changePasswordModal')"><i class="fa-solid fa-times"></i></button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="cpUserId">
            <div class="form-group"><label>新密码 <span class="required">*</span></label><input type="password" id="cpNewPassword" placeholder="至少6位"></div>
            <div class="form-group"><label>确认密码 <span class="required">*</span></label><input type="password" id="cpConfirmPassword" placeholder="再次输入"></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal('changePasswordModal')">取消</button>
            <button class="btn btn-primary" onclick="doChangePassword()">确认修改</button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function loadUsers() {
    const res = await api('/api/system/users');
    if (!res.success) { showToast(res.message, 'error'); return; }
    
    const tbody = document.getElementById('tableBody');
    const roleMap = {admin: '管理员', carrier: '承运商', dc: 'DC大仓'};
    
    tbody.innerHTML = res.data.map(u => '<tr>' +
        '<td>' + u.id + '</td>' +
        '<td><strong>' + u.username + '</strong></td>' +
        '<td>' + (u.display_name || '') + '</td>' +
        '<td>' + (roleMap[u.role] || u.role) + '</td>' +
        '<td>' + (u.must_change_password ? '<span style="color:var(--brand-secondary);">是</span>' : '否') + '</td>' +
        '<td>' + (u.created_at || '') + '</td>' +
        '<td>' +
            '<button class="btn btn-sm btn-secondary" onclick="showChangePasswordModal(' + u.id + ',\'' + u.username + '\')" title="修改密码"><i class="fa-solid fa-key"></i></button> ' +
            (u.id !== 1 ? '<button class="btn btn-sm btn-danger" onclick="deleteUser(' + u.id + ')" title="删除"><i class="fa-solid fa-trash"></i></button>' : '') +
        '</td></tr>'
    ).join('');
}

function showCreateModal() {
    document.getElementById('createUsername').value = '';
    document.getElementById('createPassword').value = '';
    document.getElementById('createDisplayName').value = '';
    document.getElementById('createRole').value = 'carrier';
    showModal('createModal');
}

async function createUser() {
    const data = {
        username: document.getElementById('createUsername').value.trim(),
        password: document.getElementById('createPassword').value,
        display_name: document.getElementById('createDisplayName').value.trim(),
        role: document.getElementById('createRole').value
    };
    if (!data.username || !data.password) { showToast('请输入用户名和密码', 'error'); return; }
    
    const res = await api('/api/system/users', {method: 'POST', body: JSON.stringify(data)});
    showToast(res.success ? res.message : res.message, res.success ? 'success' : 'error');
    if (res.success) { closeModal('createModal'); loadUsers(); }
}

function resetPassword(id) {
    confirmAction('确定重置该账号密码为110808？重置后用户需重新修改密码。', async () => {
        const res = await api('/api/system/users/' + id + '/reset_password', {method: 'POST', body: JSON.stringify({new_password: '110808'})});
        showToast(res.success ? res.message : res.message, res.success ? 'success' : 'error');
    });
}

function showChangePasswordModal(id, username) {
    document.getElementById('cpModalTitle').textContent = '修改密码 - ' + username;
    document.getElementById('cpUserId').value = id;
    document.getElementById('cpNewPassword').value = '';
    document.getElementById('cpConfirmPassword').value = '';
    showModal('changePasswordModal');
}

async function doChangePassword() {
    var id = document.getElementById('cpUserId').value;
    var newPwd = document.getElementById('cpNewPassword').value;
    var confirmPwd = document.getElementById('cpConfirmPassword').value;
    if (!newPwd) { showToast('请输入新密码', 'error'); return; }
    if (newPwd.length < 6) { showToast('密码至少6位', 'error'); return; }
    if (newPwd !== confirmPwd) { showToast('两次密码不一致', 'error'); return; }
    var res = await api('/api/system/users/' + id + '/reset_password', {method: 'POST', body: JSON.stringify({new_password: newPwd})});
    if (res.success) {
        showToast('密码修改成功', 'success');
        closeModal('changePasswordModal');
    } else {
        showToast(res.message, 'error');
    }
}

function deleteUser(id) {
    confirmAction('确定删除该账号？', async () => {
        const res = await api('/api/system/users/' + id, {method: 'DELETE'});
        showToast(res.success ? res.message : res.message, res.success ? 'success' : 'error');
        loadUsers();
    });
}

document.addEventListener('DOMContentLoaded', function() {
    loadUsers();
});
</script>
{% endblock %}
